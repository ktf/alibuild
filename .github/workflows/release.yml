---
name: Release

"on":
  release:
    types: [published]

permissions:
  contents: read # required for github.ref to be set

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/alibuild
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: python -m pip install --upgrade setuptools build pip
      - name: Build the Python distribution
        run: python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The Homebrew formula is bumped by homebrew.yml on a schedule, NOT here.
  # A job gated on `needs: pypi-publish` necessarily runs minutes after the
  # upload, and `brew bump-formula-pr` resolves the formula's Python resources
  # with `pip --uploaded-prior-to=P1D` -- which ignores anything uploaded in the
  # last day. It could therefore never resolve the version it was bumping to,
  # and failed that way for 1.17.43 and 1.17.44, leaving the formula on 1.17.42.
